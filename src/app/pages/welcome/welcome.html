<main
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-gradient-to-br from-indigo-950 via-purple-900 to-rose-900 px-4 text-white"
>
  <div class="w-orb pointer-events-none absolute z-0 -left-20 top-10 size-72 rounded-full bg-pink-500/30 blur-3xl"></div>
  <div class="w-orb pointer-events-none absolute z-0 -right-16 bottom-10 size-80 rounded-full bg-indigo-400/30 blur-3xl"></div>
  <div class="w-orb pointer-events-none absolute z-0 left-1/2 top-1/3 size-48 rounded-full bg-amber-300/20 blur-3xl"></div>

  <div class="relative z-10 flex w-full max-w-md flex-col gap-6">
    <!-- Khối 1: Chào mừng -->
    <section class="w-greeting text-center">
      <div class="mb-4 inline-block rounded-full bg-white/15 px-4 py-1 text-xs uppercase tracking-widest">
        🎓 Graduation 2026
      </div>
      <h1 class="mb-2 text-4xl font-bold leading-tight">Chào mừng bạn!</h1>
      <p class="text-white/70">Hãy nhập tên để xem thiệp mời của bạn</p>
    </section>

    <!-- Khối 2: Form -->
    <section class="w-form-card rounded-3xl border border-white/20 bg-indigo-950/80 p-8 shadow-2xl">
      <form class="space-y-4" (ngSubmit)="submit()">
        <input
          class="w-input w-full rounded-xl border-2 border-white/60 bg-white px-4 py-3 text-center text-lg text-slate-900 placeholder:text-slate-400 outline-none transition focus:border-amber-300 focus:ring-4 focus:ring-amber-300/40"
          type="text"
          name="name"
          placeholder="Nhập tên của bạn..."
          autocomplete="off"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
        />
        <button
          type="submit"
          class="w-full cursor-pointer rounded-xl bg-amber-400 px-4 py-3 text-lg font-semibold text-indigo-950 transition hover:scale-[1.02] hover:bg-amber-300 active:scale-95"
        >
          Xem thiệp mời →
        </button>
      </form>
    </section>
  </div>
</main>
